name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build FrontierArchitect.sln -c Release --nologo
      - name: Test
        run: dotnet test tests/FrontierArchitect.Tests/FrontierArchitect.Tests.csproj -c Release --nologo --no-build
      - name: Package
        run: tools/package.sh --skip-build
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontier-architect-build
          path: dist/
