# Architect agent — read at the start of every run (no restart, no new release needed).
# Schema-checked on load: if this file is invalid, the previous good version stays active
# and the error is shown in the Architect panel.
agent: architect
version: 0.2.0
model:
  id: most-capable          # resolved to the best model on the account at load
  effort: high              # thinking depth: low | medium | high | xhigh | max (replaces a token budget)
  max_output_tokens: 64000
loop:
  max_turns: 120
  max_minutes: 10
  stop_if_gain_below: 0.5   # weighted score points over the last 10 turns
  gain_window_turns: 10
objectives:                 # weights, normalised at load
  O1_farming: 1.0
  O2_logistics: 1.0
  O3_residential: 1.0
  O4_missing_buildings: 0.8
  O5_defence: 0.6
  O6_roads: 0.8
roads:
  connectivity: required
  detour_limit: 1.3
  key_trips: [house_market, house_well, producer_storage, storage_market, field_barn]
  reuse_existing_segments: true
  tile_weight: 100          # yearly walking tiles a new road tile must save to keep a shortcut
ambition_levels:
  # max_turns / max_minutes replace the loop limits for that level (bigger redesigns need longer runs)
  1: { name: Touch-up,   max_relocations: 5,   allow: [set_workers, set_production_limit, set_rotation, set_work_circle, relocate] }
  2: { name: Tidy,       max_relocations: 12,  allow: [+build, +road_add, +road_remove] }
  3: { name: Rework,     max_relocations: 30,  allow: [+field_create, +field_resize, +field_remove, +demolish, +clear_area], max_turns: 150, max_minutes: 15 }
  4: { name: Redistrict, max_relocations: 80,  allow: [+flatten], max_turns: 200, max_minutes: 25 }
  5: { name: Rebuild,    max_relocations: all, allow: [all], movable: [town_center, walls, gates], max_turns: 260, max_minutes: 35 }
planning:
  reserve_next_tier: true
  offline_cap: 0.5          # tier 1 and 2 building types only
  build_replacement_first: true
  min_gain: 2               # points; smaller changes are not proposed
  phase_max_actions: 12
  max_slope_deg: 12
  relocation_cost_factor: 0.5
tools:
  enabled: [get_region, query, find_sites, check_placement, apply_to_draft, undo_draft,
            route_road, route_network, path_distance, coverage, evaluate_rotation,
            score_draft, forecast_stock, submit_plan, set_zones, place_group]
  descriptions: {}          # tool name -> replacement description shown to Claude
ops:
  disabled: []              # ops Claude may never propose
output:
  schema: architect_plan_v1
  rationale: short_line
  language: en
